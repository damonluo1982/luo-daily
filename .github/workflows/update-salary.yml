name: 薪酬COE周报
on:
  schedule:
    - cron: "0 2 * * 1"  # 北京时间 周一 10:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Update salary module
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/update_module.py salary
      - name: Commit and push
        run: |
          git config user.name "luo-bot"
          git config user.email "actions@github.com"
          git add index.html data/updates.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update: salary $(TZ=Asia/Shanghai date +'%m-%d')"
            git push
          fi
